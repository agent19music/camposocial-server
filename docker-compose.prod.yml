# ============================================================================
# Docker Compose - Production Configuration
# ============================================================================
# This file is for PRODUCTION deployment with automatic migration handling.
#
# The 'migrate' service runs first and must succeed before 'app' starts.
# This ensures database schema is always up-to-date before the app runs.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Code-only deployment (skip migrations):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps app
# ============================================================================

services:
  # ============================================================================
  # Migration Service - Runs FIRST, exits after completion
  # ============================================================================
  migrate:
    image: camposocial-server:${IMAGE_TAG:-latest}
    container_name: camposocial-migrate
    environment:
      - MIGRATE_ONLY=true
      - DATABASE_URL=${DATABASE_URL}
      - FLASK_APP=app.py
    networks:
      - camposocial-network
    # Exit after running - don't restart
    restart: "no"
    deploy:
      restart_policy:
        condition: none

  # ============================================================================
  # Flask Application Service
  # ============================================================================
  app:
    image: camposocial-server:${IMAGE_TAG:-latest}
    container_name: camposocial-server
    ports:
      - "80:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - FLASK_APP=app.py
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - USE_REDIS_QUEUE=true
      - SOCKETIO_ASYNC_MODE=eventlet
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - SEED_BADGES=false
      # IntaSend Payment Integration
      - INTASEND_API_KEY=${INTASEND_API_KEY}
      - INTASEND_PUBLISHABLE_KEY=${INTASEND_PUBLISHABLE_KEY}
      - INTASEND_WEBHOOK_SECRET=${INTASEND_WEBHOOK_SECRET}
      - INTASEND_SANDBOX=${INTASEND_SANDBOX:-false}
      - BADGE_PAYMENT_PROVIDER=${BADGE_PAYMENT_PROVIDER:-intasend}
      - FRONTEND_URL=${FRONTEND_URL}
      - SELLER_DASHBOARD_URL=${SELLER_DASHBOARD_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - camposocial-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/camposocial/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Redis Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: camposocial-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 100mb --maxmemory-policy allkeys-lru
    networks:
      - camposocial-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  camposocial-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
