# Fly.io Staging Configuration (Camposocial)
# Generated for migration from Railway to Fly.io + Neon Postgres

app = "camposocial-server-staging"
primary_region = "jnb"  # Johannesburg (Change if needed)

[build]
  dockerfile = "Dockerfile"

[env]
  # Using PORT 8080 to match gunicorn config
  PORT = "8080"
  
  # Ensure Flask app is discoverable for migrations
  FLASK_APP = "app.py"
  
  # Configure SocketIO async mode for production-like environment
  SOCKETIO_ASYNC_MODE = "eventlet"
  
  # Disable Redis queue for staging unless explicitly enabled via secrets
  # This avoids connection errors if no Redis is provisioned
  USE_REDIS_QUEUE = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true   # Scale down to zero when idle (save money on staging!)
  auto_start_machines = true  # Wake up on request
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024  # 1GB RAM is plenty for staging

# Run start.sh script (migrations + gunicorn)
[experimental]
  cmd = ["bash", "start.sh"]
