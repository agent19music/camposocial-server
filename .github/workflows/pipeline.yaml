name: Camposocial CI/CD

on:
  push:
    branches:
      - staging  # Triggers Staging Deploy
      - main     # Triggers Prod Deploy
  pull_request:
    branches:
      - main
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # JOB 1: CI & TESTS (Runs on all pushes)
  # ------------------------------------------------------------------
  integration-test:
    runs-on: ubuntu-latest
    services:
      # We spin up a temp Redis for testing since your app needs it
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # The "Migration Sanity Check" you asked for
      # This initializes a fresh SQLite DB and tries to run upgrades
      # If this fails, we know the migration script is broken
      - name: Verify Database Migrations
        env:
          FLASK_APP: app.py
          DATABASE_URL: sqlite:///test_migration.db
          SECRET_KEY: testing_key
        run: |
          flask db upgrade
          echo "Migrations applied successfully!"

      - name: Run Tests
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite:///test.db
        # If you don't have tests yet, this will just pass. 
        # Add a 'tests/' folder and basic pytest later.
        run: |
          if [ -d "tests" ]; then pytest; else echo "No tests found, skipping"; fi

  # ------------------------------------------------------------------
  # JOB 2: STAGING DEPLOY (Railway)
  # Triggers only on 'staging' branch push
  # ------------------------------------------------------------------
  deploy-staging:
    needs: integration-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service camposocial-server --detach

  # ------------------------------------------------------------------
  # JOB 3: PRODUCTION BUILD & DEPLOY (DigitalOcean)
  # Triggers only on 'main' branch push
  # ------------------------------------------------------------------
  build-and-push-prod:
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-prod-ssh:
    needs: build-and-push-prod
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_PASSPHRASE }}
          envs: IMAGE_TAG,REGISTRY,IMAGE_NAME
          script: |
            # 1. Login to GHCR so Docker can pull the image
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2. Navigate to project folder
            cd /opt/camposocial/app
            
            # 3. Pull the specific image we just built
            # Note: We need to lowercase the image name because Docker is picky
            FULL_IMAGE=$(echo $REGISTRY/$IMAGE_NAME:$IMAGE_TAG | tr '[:upper:]' '[:lower:]')
            docker pull $FULL_IMAGE
            
            # 4. Export the tag so Docker Compose uses it
            export IMAGE_TAG=$IMAGE_TAG
            
            # 5. Run migrations (using your migrate service)
            docker compose -f docker-compose.prod.yml run --rm migrate
            
            # 6. Restart the app service (Rolling update)
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            
            # 7. Verify Health
            echo "Waiting for health check..."
            sleep 15
            if curl --fail http://localhost:5000/camposocial/api/; then
              echo "Health check passed!"
            else
              echo "Health check failed!"
              exit 1
            fi

            # 8. Cleanup old images
            docker image prune -f