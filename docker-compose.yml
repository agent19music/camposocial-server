# ============================================================================
# Docker Compose - Development Configuration
# ============================================================================
# This file is for LOCAL DEVELOPMENT only.
# For production, use docker-compose.prod.yml
#
# Usage:
#   docker compose up --build           # Start services
#   docker compose exec app flask db upgrade  # Run migrations
#   docker compose down                 # Stop services
# ============================================================================

services:
  # Flask application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camposocial-server
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-true}
      - FLASK_APP=app.py
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - USE_REDIS_QUEUE=true
      - SOCKETIO_ASYNC_MODE=eventlet
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID}}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY}}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - IMAGE_PREFIX=${IMAGE_PREFIX}
      - SEED_BADGES=${SEED_BADGES:-true}
      - POSTGRES_HOST=${POSTGRES_HOST:-localhost}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    volumes:
      # Mount source code for hot reloading in development
      - .:/app
      # Prevent overwriting installed packages
      - /app/__pycache__
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - camposocial-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/camposocial/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Development resource limits (generous for debugging)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Redis service for WebSocket message queue and caching
  redis:
    image: redis:7-alpine
    container_name: camposocial-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    networks:
      - camposocial-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  camposocial-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
